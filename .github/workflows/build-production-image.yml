name: Build production image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image_name
        shell: bash
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image_name.outputs.value }}:latest
            ${{ steps.image_name.outputs.value }}:${{ github.sha }}
          build-args: |
            VITE_MORSE_BOOK_CONTENT_BASE_URL=${{ vars.VITE_MORSE_BOOK_CONTENT_BASE_URL }}
            VITE_ENABLE_LOCAL_BOOK_CONTENT_ROUTE=${{ vars.VITE_ENABLE_LOCAL_BOOK_CONTENT_ROUTE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
